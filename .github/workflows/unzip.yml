name: Unzip upload

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack uploaded zip files
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip file in the repository root"; exit 0; fi
          for z in "${zips[@]}"; do
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then src="${entries[0]}"; else src="$tmp"; fi
            rsync -a --exclude='.github' "$src"/ ./
            rm -f "$z"
          done
          rm -rf __MACOSX

      - name: Commit the unpacked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Unpack uploaded project zip"
          git push
